name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobachev/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd ios
          touch Config/Local.xcconfig
          xcodegen generate

      - name: Build unsigned .app
        run: |
          xcodebuild clean build \
            -project ios/IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build

      - name: Package .ipa for Sideloadly
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/IPhoneAgent.app Payload/
          zip -qr ESP32Agent.ipa Payload
          ls -lh ESP32Agent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32Agent-IPA
          path: ESP32Agent.ipa
          retention-days: 7
