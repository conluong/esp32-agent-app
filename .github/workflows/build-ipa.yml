name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios
        run: |
          touch Config/Local.xcconfig
          xcodegen generate

      - name: Build unsigned .app
        working-directory: ios
        run: |
          xcodebuild archive \
            -project IPhoneAgent.xcodeproj \
            -scheme IPhoneAgent \
            -configuration Release \
            -archivePath build/IPhoneAgent.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || {
              echo "=== XCODEBUILD FAILED: SHOWING ERRORS ==="
              grep -E "error:" build.log -B 2 -A 3 || true
              echo "=== TAIL OF BUILD LOG ==="
              tail -n 60 build.log
              exit 1
            }

      - name: Package .ipa for Sideloadly
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "*.app" | grep -v "AgentActivity" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr ESP32Agent.ipa Payload
          ls -lh ESP32Agent.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32Agent-IPA
          path: ESP32Agent.ipa
          retention-days: 7
